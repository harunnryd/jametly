name: build-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  cache-prime:
    name: prime caches (scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu
          prefix-key: cache-prime
          cache-on-failure: "true"
      - run: cargo fetch
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v3
      - name: Install Tauri build deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libglib2.0-dev
      - run: cargo build --workspace --all-features

  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: []
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]
        include:
          - os: macos-latest
            timeout: 12
          - os: ubuntu-latest
            timeout: 12
          - os: windows-2022
            timeout: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
          prefix-key: v1-tauri
          cache-on-failure: "true"
          workspaces: |
            . -> target
            src-tauri -> ../src-tauri/target
            core -> ../core/target

      - name: Set up sccache (Windows only — cuts cold-cache build)
        if: matrix.os == 'windows-2022'
        uses: mozilla-actions/sccache-action@v0.0.4
        env:
          SCCACHE_GHA_ENABLED: "true"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Tauri build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libglib2.0-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/uv
            ~/.cache/uv
            C:/Users/runner/AppData/Local/uv/cache
          key: uv-${{ runner.os }}-${{ hashFiles('ai/uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install deps
        run: |
          uv sync --all-extras --frozen
          pnpm install --frozen-lockfile
          cargo fetch

      - name: Tier 0 verify (PR gate)
        run: just verify
        env:
          CI: "true"

  verify-ci:
    name: verify-ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: []
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]
        include:
          - os: macos-latest
            timeout: 18
          - os: ubuntu-latest
            timeout: 18
          - os: windows-2022
            timeout: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
          prefix-key: v1-tauri
          cache-on-failure: "true"
          workspaces: |
            . -> target
            src-tauri -> ../src-tauri/target
            core -> ../core/target

      - name: Set up sccache (Windows only — cuts cold-cache build)
        if: matrix.os == 'windows-2022'
        uses: mozilla-actions/sccache-action@v0.0.4
        env:
          SCCACHE_GHA_ENABLED: "true"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Tauri build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libglib2.0-dev

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/uv
            ~/.cache/uv
            C:/Users/runner/AppData/Local/uv/cache
          key: uv-${{ runner.os }}-${{ hashFiles('ai/uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install deps
        run: |
          uv sync --all-extras --frozen
          pnpm install --frozen-lockfile
          cargo fetch

      - name: Tier 1 verify-ci
        run: just verify-ci
        env:
          CI: "true"

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: []
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"
      - uses: extractions/setup-just@v3
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - run: just audit

  mutants-weekly:
    name: cargo-mutants (weekly, monday cron)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutants (time-boxed at 90 min)
        run: timeout 5400 cargo mutants --workspace --timeout 60 --regressions | tee mutants.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-log
          path: mutants.log

  stealth-e2e-macos:
    name: stealth E2E (macOS only — xcap + osascript)
    runs-on: macos-latest
    needs: []
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          uv sync --all-extras --frozen
          cargo fetch
      - name: Stealth verification (xcap + osascript)
        run: JAMETLY_STEALTH_E2E=1 uv run pytest tests/stealth -v
        continue-on-error: true
