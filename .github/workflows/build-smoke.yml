name: build-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Once a week, Monday 09:00 UTC — nightly Tier 2 (`just verify-strict`) catches upstream dep drift
    - cron: "0 9 * * 1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> ../src-tauri/target
            core -> ../core/target

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.x"

      - uses: extractions/setup-just@v3

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install deps
        run: |
          uv sync --all-extras --frozen
          cargo fetch

      - name: Tier 0 verify (PR gate)
        run: just verify
        env:
          CI: "true"

      - name: Tier 1 verify-ci
        run: just verify-ci
        env:
          CI: "true"

      - name: Audit
        run: just audit
        continue-on-error: true

  mutants-weekly:
    name: cargo-mutants (weekly, monday cron)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutants (time-boxed at 90 min)
        run: timeout 5400 cargo mutants --workspace --timeout 60 --regressions | tee mutants.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-log
          path: mutants.log

  stealth-e2e-macos:
    name: stealth E2E (macOS only — xcap + osascript)
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          uv sync --all-extras --frozen
          cargo fetch
      - name: Stealth verification (xcap + osascript)
        run: JAMETLY_STEALTH_E2E=1 uv run pytest tests/stealth -v
        # Until src-tauri/ scaffold is in place, mark expected-fail.
        continue-on-error: true
