[workspace]
resolver = "2"
members = [
    "src-tauri",
    "core/ipc-proto",
    # core/audio-backend (Phase 1+)
    # core/screen-capture (Phase 1+)
    # core/sqlite-store (Phase 1+)
    # core/secure-store (Phase 1+)
    # core/stealth-macos (Phase 5+; opt-in)
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/jametly/jametly"

[workspace.dependencies]
# Core Tauri stack (Phase 1+ — uncomment as needed)
# tauri                       = { version = "2", features = ["macos-private-api"] }
# tauri-build                 = "2"
# tauri-plugin-shell           = "2"
# tauri-plugin-global-shortcut = "2"
# tauri-plugin-keychain        = "2"
# tauri-plugin-opener          = "2"
# tauri-plugin-sql             = { version = "2", features = ["sqlite"] }
# tauri-plugin-updater         = "2"
# tauri-plugin-autostart       = "2"
# tauri-plugin-macos-permissions = "2"

# Per-OS audio (Phase 1+)
# cpal                       = "0.15"
# cidre                      = { version = "0.11", features = ["ca","sc","objc"] }   # mac only
# wasapi                     = "0.13"                                                # win only
# libpulse-binding           = { version = "2.30", features = ["async"] }          # linux only
# libpulse-simple-binding    = "2.30"                                                # linux only

# Screen capture (Phase 3+)
# xcap    = "0.0.12"
# image   = { version = "0.25", default-features = false }

# Async + utility
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
ringbuf     = "0.4"

# Test tier (per docs/conventions/TEST_STRATEGY.md §3a)
proptest     = "1.5"
mockall      = "0.13"
insta        = { version = "1.41", features = ["yaml"] }
rstest       = "0.23"
test-case    = "3.3"
nextest      = "0.12"
llvm-cov     = "0.6"

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
opt-level = 0
debug = true
