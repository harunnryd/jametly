[project]
name = "jamly"
version = "0.0.0"
description = "jametly AI sidecar — stdio JSON-RPC + NDJSON echo handler (Phase 0)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "faster-whisper>=1.2,<2",
  "silero-vad>=6.2,<7",
  "langchain-core>=1.6.0",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "langchain>=1.3.16",
]

[project.scripts]
jamly = "jamly.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jamly"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src-tauri", "target", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --no-header --strict-markers"
