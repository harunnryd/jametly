[tool.uv.workspace]
members = ["ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --no-header --strict-markers"
markers = [
    "slow: exceeds the Tier 0 budget; excluded from `just verify`",
    "network: needs network or on-disk model weights; excluded from `just verify`",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.98",
    "pytest-benchmark>=4.0",
    "pip-audit>=2.7",
]
