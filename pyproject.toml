[project]
name = "jamly"
version = "0.0.0"
description = "jametly AI sidecar — local LLM/STT/OCR orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
  # LangChain + LangGraph (AI orchestration)
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-store-sqlite>=0.2",
  "langchain-text-splitters>=0.3",
  # Protocol + config + validation
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  # Concurrency + IPC bridge
  "anyio>=4.4",
  # LLM provider SDKs (user adds keys in OS keychain; jars pulled in)
  "openai>=1.50",
  "anthropic>=0.40",
  "google-genai>=0.5",
  # Audio
  "numpy>=2.0",
  "sounddevice>=0.4.6",
  "faster-whisper>=1.0.3",
  # VAD
  "silero-vad>=5.1",
  # Speaker diarization
  "diart>=0.7",
  "pyannote-audio>=3.1",
  # OCR
  "marker-pdf>=0.2",
  # Retrieval / semantic search
  "sentence-transformers>=3.0",
  "sqlite-vec>=0.1.6",
  # Output exporters (post-process phase)
  "pysrt>=1.1.2",
  "webvtt-py>=0.5.1",
  "weasyprint>=63.0",
  "markdown>=3.6",
  # Image
  "Pillow>=10.4",
  # HTTP client
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  # pytest + fixtures
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-watch>=4.3",
  "pytest-xdist>=3.6",
  "pytest-benchmark>=4.0",
  "pytest-recording>=0.13",
  # Property-based + snapshot + replay
  "hypothesis>=6.108",
  "syrupy>=4.7",
  "respx>=0.21",
  "vcrpy>=6.0",
  # Lint + type + security
  "ruff>=0.7",
  "mypy>=1.11",
  "bandit>=1.7.10",
  "pip-audit>=2.7",
  # AI/LLM testing
  "deepeval>=1.0",
  # IPC schema validation against shared/schemas/ipc/v1.json
  "jsonschema>=4.23",
]

[project.scripts]
jamly = "jamly.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jamly"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src-tauri", "target"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
]
ignore = [
  "E501",  # line length — handled by formatter
  "B008",  # function call in default — common in pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401"]  # test files have specific conventions

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyannote.*", "diart.*", "silero_vad.*", "marker.*", "sentence_transformers.*", "faster_whisper.*", "deepeval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "ai/tests"]
asyncio_mode = "auto"
addopts = "-q --no-header --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "hardware: requires real audio device (deselect with '-m \"not hardware\"')",
  "stealth: stealth-overlay E2E (gated on JAMETLY_STEALTH_E2E=1)",
  "network: requires network (deselect with '-m \"not network\"')",
  "hypothesis: hypothesis property tests",
]
